logLevel: info
logDestinations: [stdout]
rtsp: true
rtspAddress: 127.0.0.1:{rtspPort}
rtspTransports: [tcp]
rtmp: false
hls: false
webrtc: false
srt: false
moq: false
playback: false
metrics: false
pprof: false
api: true
apiAddress: 127.0.0.1:{controlApiPort}
authInternalUsers:
  - user: any
    ips: [127.0.0.1]
    permissions:
      - action: publish
        path: camera
      - action: read
        path: camera
      - action: api
paths:
  camera:
    source: publisher
